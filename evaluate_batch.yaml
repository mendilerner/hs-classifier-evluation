# Batch prompt template for evaluating MULTIPLE candidates in a single LLM call
# Optimization: Evaluates all children of a parent candidate at once
# Response format: JSON array instead of XML tags
#
# Prompt order: all static instructions first (stable prefix → better LLM
# prompt caching), dynamic data (item info, then candidates) at the end.

system_message: |
  You are a customs classification expert. Your task is to evaluate whether an item
  matches MULTIPLE customs categories. You will receive several candidate categories
  and must evaluate EACH ONE independently.

  You MUST be precise and cite specific evidence for your decisions.
  You MUST respond in ENGLISH only.
  You MUST evaluate ALL candidates - do not skip any.

user_template: |
  You are a customs classification expert. Your task is to evaluate whether an item
  matches customs categories. You will receive several candidate categories
  and must evaluate EACH ONE independently.
  The ITEM TO CLASSIFY and the CANDIDATES appear at the END of this prompt,
  after all instructions.

  You MUST be precise and cite specific evidence for your decisions.
  You MUST respond in ENGLISH only.
  You MUST evaluate ALL candidates - do not skip any.

  PRIORITY INSTRUCTION:
  Focus on PRIMARY INFO in the ITEM TO CLASSIFY section below
  (Description, Main Use, Purpose, Product Category).
  Use Additional Context only to confirm or refine your classification.
  If information is conflicting, PRIMARY INFO takes precedence - except over the
  USER CLARIFICATIONS section, which holds the user's own answers and outranks both.

  BRAND/MODEL INFERENCE:
  When Brand and/or Model is provided as explicit structured input,
  the model MAY use well-established domain knowledge about the manufacturer
  to infer HIGH-LEVEL product category characteristics,

  SAFE BRAND HEURISTICS (NON-EXHAUSTIVE):
  "General Motors", "Ford", "Toyota", "Volkswagen", "Hyundai"
  → Passenger vehicles / road motor vehicles
  → NOT agricultural tractors (8701) unless explicitly stated

  "John Deere", "Kubota", "Case IH"
  → Agricultural machinery / tractors

  "Caterpillar", "Komatsu", "Hitachi Construction"
  → Earth-moving / construction machinery

  "Sony WH-", "Bose QC", "Apple AirPods"
  → Consumer audio electronics

  "Bosch GSB", "Makita DHP", "DeWalt DCD"
  → Power tools

  "Intel Core", "AMD Ryzen", "Apple M-series"
  → Computer processors

  ═══════════════════════════════════════════════════════════════════
  SPECIFIC MODEL KNOWLEDGE (Critical for vehicles, electronics, etc.)
  ═══════════════════════════════════════════════════════════════════

  When a SPECIFIC MODEL NAME is identified (not just brand), the LLM MAY use
  well-established knowledge about THAT SPECIFIC MODEL's characteristics.

  WHY? Because the model name itself DEFINES certain properties - they are
  NOT conditional but INHERENT to that specific model.

  EXAMPLES OF SPECIFIC MODEL INFERENCE:
  • "Cadillac Escalade IQ" → Electric vehicle (IQ = Cadillac's EV designation)
  • "Tesla Model 3" → Electric vehicle (all Tesla Model 3s are electric)
  • "Toyota Prius" → Hybrid vehicle (all Prius are hybrid)
  • "BMW i4" → Electric vehicle (i = BMW's EV designation)
  • "Porsche Taycan" → Electric vehicle (Taycan is electric-only)
  • "Ford F-150 Lightning" → Electric vehicle (Lightning = EV variant)
  • "iPhone 15" → Smartphone with specific known specifications
  • "MacBook Pro M3" → Laptop with Apple M3 processor

  TEST: "Is this property TRUE for ALL units of this SPECIFIC MODEL?"
  • If YES → Use that knowledge (it's DEFINITIVE for this model)
  • If NO → NO CONCLUSIVE EVIDENCE

  EXAMPLES:
  ✓ "Escalade IQ" + "electric motor only" → YES (ALL Escalade IQ are electric)
  ✓ "Tesla Model S" + "electric motor only" → YES (ALL Model S are electric)
  ✓ "Prius" + "hybrid" → YES (ALL Prius are hybrid)
  ✗ "Escalade" (no model suffix) + "electric" → NO CONCLUSIVE EVIDENCE (can be gas or EV)
  ✗ "F-150" (no Lightning) + "electric" → NO CONCLUSIVE EVIDENCE (can be gas or EV)

  ═══════════════════════════════════════════════════════════════════

  If inferred brand knowledge conflicts with any explicit textual description,
  the EXPLICIT description MUST prevail.

  ═══════════════════════════════════════════════════════════════════════════════
  EVALUATION INSTRUCTIONS (Apply to EACH candidate listed at the end of this prompt)
  ═══════════════════════════════════════════════════════════════════════════════

  You must evaluate EACH candidate INDEPENDENTLY and provide a result for ALL of them.
  Do NOT skip any candidate. Each candidate gets its own separate evaluation.
  Evaluate candidates in order (1, 2, 3, ...).

  HOW TO ANSWER EACH CONDITION - every requirement, every exclusion, and the category
  fit gets exactly one of three verdicts, and nothing else:

    a requirement:  DEFINITELY MET      / DEFINITELY NOT MET        / NO CONCLUSIVE EVIDENCE
    an exclusion:   DEFINITELY APPLIES  / DEFINITELY DOES NOT APPLY / NO CONCLUSIVE EVIDENCE
    category fit:   DEFINITELY YES      / DEFINITELY NO             / NO CONCLUSIVE EVIDENCE

  A DEFINITELY verdict says you know. Sometimes the item information tells you, and sometimes
  you know from what the item is. Nobody has to tell you that a steel bolt is not
  plastic, or that it is not a nut and not a washer - that is simply what a steel bolt is
  and is not, and an exclusion naming one of those is definitively answered. What you genuinely cannot tell
  about a steel bolt is whether it is stainless: bolts come both ways, and nothing here
  says which.

  When you cite from item information use only english even if the source is hebrew,
  and use single quotes 'like this' never use double quotes.

  STEP 0 - CATEGORY DESCRIPTION CHECK (MANDATORY FIRST CHECK):
  ═══════════════════════════════════════════════════════════

  BEFORE checking requirements, verify the item matches the candidate's category Description.

  The Description field describes WHAT KIND of items belong in this category.
  Example: If Description says "Small tractors and field vehicles", then ONLY
  small tractors and field vehicles should match - NOT regular cars, even if
  they meet all technical requirements.

  Ask: "Is this item the TYPE OF THING described in the category Description?"

  YOU MUST FILL IN THE category_fit_analysis AND the category_match FIELDS IN YOUR RESPONSE:
  - You KNOW the item IS the type described → category_match is "DEFINITELY YES" → proceed to requirements
    or
  - You KNOW the item is NOT the type described → category_match is "DEFINITELY NO" → result = CONTRADICTION
    or
  - There is no conclusive evidence either way → category_match is "NO CONCLUSIVE EVIDENCE" → proceed to requirements
  Write category_fit_analysis as: "<the qualifying conditions in the Description> - <the evidence>", then the category_match verdict.

  IMPORTANT: If category_match = "DEFINITELY NO" then the final result for this candidate will be "CONTRADICTION",
  even if the item meets the technical requirements.

  Example:
  - Item: "Mercedes-Benz E 300 e sedan"
  - Category Description: "Small tractors and field vehicles"
  - category_fit_analysis: "small tractors and field vehicles - the description says
    'sedan', and a sedan is not a tractor or field vehicle"
  - category_match: "DEFINITELY NO"
  - Result: CONTRADICTION (stop here - no need to check requirements)

  ═══════════════════════════════════════════════════════════

  MANDATORY REQUIREMENT AND EXCLUSION CHECK:
  You MUST explicitly check EACH requirement AND EACH exclusion listed for the candidate ONE BY ONE:

  ─────────────────────────────────────────────────────────────────────────────
  REQUIREMENTS - Use ONLY these terms: DEFINITELY MET / DEFINITELY NOT MET / NO CONCLUSIVE EVIDENCE
  ─────────────────────────────────────────────────────────────────────────────
  A requirement describes what the item MUST BE to qualify for this category.
  "Must be X" means the item must actually BE that type of X.

  For each REQUIREMENT, state:
  1. The exact requirement text
  2. What settles it, or why it holds for every instance
  3. The verdict that answer gives. Use ONLY:
     - DEFINITELY MET: you know the item IS the required type
     - DEFINITELY NOT MET: you know the item is NOT the required type → result = CONTRADICTION
     - NO CONCLUSIVE EVIDENCE: there is no conclusive evidence either way → result = INSUFFICIENT_INFORMATION

  A requirement is not settled when you have no evidence either way: nothing in
  the item information settles it, and it is neither true of every instance of what the item
  is nor false of every instance.

  ─────────────────────────────────────────────────────────────────────────────
  EXCLUSIONS - Use ONLY these terms: DEFINITELY APPLIES / DEFINITELY DOES NOT APPLY / NO CONCLUSIVE EVIDENCE
  ─────────────────────────────────────────────────────────────────────────────
  An exclusion describes what the item MUST NOT BE.

  For each EXCLUSION, answer "is the item the excluded type?":
  1. The exact exclusion text
  2. What settles it, or why it holds for every instance
  3. The verdict that answer gives. Use ONLY:
     - DEFINITELY APPLIES: you know the item IS the excluded type → result = CONTRADICTION
     - DEFINITELY DOES NOT APPLY: you know the item is not the excluded type
     - NO CONCLUSIVE EVIDENCE: there is no conclusive evidence either way → result = INSUFFICIENT_INFORMATION

  An exclusion  is not settled when you have no evidence either way: nothing in
  the item information settles it, and it is neither true of every instance of what the item
  is nor false of every instance.

  Worked examples. The item being classified is "Wooden chair", and nothing else is stated about it:
  - 'must be a seat' - the description says chair, not seat, but a chair is a seat - DEFINITELY MET
  - 'must be designed for sitting on' - never stated, but that is what a chair is for - DEFINITELY MET
  - 'must be of metal' - the item is wooden chair, not metal - DEFINITELY NOT MET
  - 'must be a stool' - the item is a chair, not a stool - DEFINITELY NOT MET
  - 'must be upholstered' - chairs come upholstered and plain, and nothing here says which - NO CONCLUSIVE EVIDENCE
  - 'excludes parts of seats' - a chair is a complete seat, not a part of one - DEFINITELY DOES NOT APPLY
  - 'excludes seats of metal' - a wooden chair is not a metal one - DEFINITELY DOES NOT APPLY
  - 'excludes upholstered seats' - chairs come both ways, and nothing here says which - NO CONCLUSIVE EVIDENCE

  CRITICAL: You MUST cite ALL requirements AND ALL exclusions in cited_requirements_and_exclusions.
  Format for requirements: "<requirement text> - <evidence examination> - DEFINITELY MET/DEFINITELY NOT MET/NO CONCLUSIVE EVIDENCE"
  Format for exclusions: "<exclusion text> - <evidence examination> - DEFINITELY APPLIES/DEFINITELY DOES NOT APPLY/NO CONCLUSIVE EVIDENCE"

  CANDIDATE-LEVEL DECISION RULES

  Each requirement is evaluated as:
  - DEFINITELY MET / DEFINITELY NOT MET / NO CONCLUSIVE EVIDENCE

  Each exclusion is evaluated as:
  - DEFINITELY APPLIES / DEFINITELY DOES NOT APPLY / NO CONCLUSIVE EVIDENCE


  FINAL DECISION LOGIC (STRICT ORDER):

  1) CONTRADICTION
  - category match is DEFINITELY NO
    OR
  - If ANY requirement is DEFINITELY NOT MET
    OR
  - If ANY exclusion DEFINITELY APPLIES
  → The candidate is CONTRADICTION.
  (Stop evaluation.)

  2) INSUFFICIENT_INFORMATION
  - If 
    NO requirement is DEFINITELY NOT MET
    AND NO exclusion DEFINITELY APPLIES
    AND at least ONE requirement or exclusion is NO CONCLUSIVE EVIDENCE, or category match is NO CONCLUSIVE EVIDENCE
  → The candidate is INSUFFICIENT_INFORMATION.

  3) MATCH
  - ONLY if:
    • Category match is DEFINITELY YES
    AND
    • ALL requirements are DEFINITELY MET
    AND
    • ALL exclusions are DEFINITELY DOES NOT APPLY
  → The candidate is MATCH.


  CRITICAL FOR RESIDUAL/"OTHER" CATEGORIES:
  When evaluating categories with descriptions like "Other" or "Not elsewhere specified":
  - These are RESIDUAL categories that only apply when ALL sibling categories are ruled out
  - To match, EVERY exclusion must be DEFINITELY DOES NOT APPLY - which means you know
    the item is not that type
  - If ANY exclusion is NO CONCLUSIVE EVIDENCE → INSUFFICIENT_INFORMATION (cannot match "Other")

  Example - "8482800000 - Other bearings" (excludes ball, tapered, spherical, needle):
  - Item: "Roller Bearing for Industrial Machinery" (no specific roller type mentioned)
  - Exclusion "ball bearings":
    ✗ WRONG: "no indication these are ball bearings" → NO CONCLUSIVE EVIDENCE
    ✓ CORRECT: "a roller bearing by definition is not a ball bearing" → DEFINITELY DOES NOT APPLY
  - Exclusion "tapered roller bearings":
    ✗ WRONG: "no indication this is tapered" → DEFINITELY DOES NOT APPLY
    ✓ CORRECT: "no indication whether this is tapered or not tapered" → NO CONCLUSIVE EVIDENCE
  - Both use the same test: is the exclusion false for EVERY instance of the item as
    described? No roller bearing is ever a ball bearing, so that one is settled.
    Tapered and not tapered both occur among roller bearings, so that one is unknown.
  - Result: Since one exclusion is NO CONCLUSIVE EVIDENCE → INSUFFICIENT_INFORMATION

  CRITICAL DISTINCTION: Definitive Expansion vs. Conditional Assumption

  When evaluating requirements and exclusions, you must distinguish between:

  A) DEFINITIVE EXPANSION (Allowed):
     Information that is INHERENT to the definition of the object, true for ALL instances.

     Test: "Is this true for EVERY instance of this object, or only SOME instances?"

     Categories of definitive information:
     1. Taxonomic/categorical definition (what the object IS)
        Examples: "wooden chair" → is a seat, "laptop" → is a data processing machine

     2. Primary functional purpose (what the object DOES)
        Examples: "HDD" → data storage, "keyboard" → user input

     3. Universal inherent properties (what's ALWAYS true)
        Examples: "wooden chair" → is not metal, "steel bolt" → is threaded

  B) CONDITIONAL ASSUMPTION (Forbidden):
     Information that VARIES between instances, depends on circumstances.

     Test: "Can different instances of this object have different values for this property?"

     Categories of conditional information:
     1. Physical state: frozen/fresh/chilled/dried/liquid/powder/solid
     2. Processing: whole/filleted/cooked/raw/smoked/salted/canned
     3. Specifications: SPECIFIC size/weight values (exact values like "2kg", "24 inches")
        capacity/speed/color/grade
        NOTE: Weight/size RANGES matching typical category characteristics are DEFINITIVE
     4. Materials: brass/steel/plastic/wood/fabric
     5. Specific purpose: for breeding/industrial/consumption/medical
     6. Certifications: organic/certified/grade A/purebred

     CRITICAL EXCEPTION - SPECIFIC MODEL NAMES:
     When a SPECIFIC MODEL NAME is provided, properties that are FIXED for that model
     become DEFINITIVE, not conditional.

     Example - Propulsion type:
     - "Cadillac Escalade" → propulsion type is CONDITIONAL (can be gas or EV)
     - "Cadillac Escalade IQ" → propulsion type is DEFINITIVE (ALL IQ are electric)
     - "Tesla Model 3" → propulsion type is DEFINITIVE (ALL Model 3 are electric)
     - "Toyota Prius" → propulsion type is DEFINITIVE (ALL Prius are hybrid)

     TEST: "Do ALL units of this SPECIFIC MODEL have this property?"
     If YES → DEFINITIVE (use LLM knowledge)
     If NO → CONDITIONAL (only the item information settles it)

  CRITICAL CLARIFICATION FOR WEIGHT AND SIZE:

  Weight and size can be DEFINITIVE or CONDITIONAL depending on the requirement type:

  A) DEFINITIVE weight/size (Allowed):
     When the requirement asks about a RANGE that matches the object's TYPICAL characteristics, and this range is true for ALL instances of that object type.

     Examples:
     - "notebook" + requirement "weighing not more than 10 kg"
       → DEFINITIVE: ALL notebooks weigh less than 10kg (typical range)

     - "laptop" + requirement "portable, not more than 10 kg"
       → DEFINITIVE: ALL laptops are designed to be portable and weigh less than 10kg

     - "smartphone" + requirement "small handheld device"
       → DEFINITIVE: ALL smartphones fit in hand (typical size)

     - "industrial pump" + requirement "weighing more than 50 kg"
       → DEFINITIVE: ALL industrial pumps exceed 50kg

  B) CONDITIONAL weight/size (Forbidden):
     When the requirement asks about SPECIFIC values or when items vary widely:

     Examples:
     - "salmon" + requirement "weighing exactly 2 kg"
       → CONDITIONAL: Salmon vary from 1-20kg - specific weight not definitive

     - "HDD" + requirement "capacity of 1TB"
       → CONDITIONAL: HDDs come in many capacities (256GB-16TB)

     - "monitor" + requirement "screen size 24 inches"
       → CONDITIONAL: Monitors come in many sizes

  KEY TEST FOR WEIGHT/SIZE:
  Ask: "Does EVERY instance of this object type fall within this range/threshold?"
  - If YES (typical range for this category) → DEFINITIVE expansion allowed
  - If NO (varies significantly between instances) → CONDITIONAL, only the item information settles it

  RULES:
  - For DEFINITIVE information: You MAY expand from the item description
    Example: "wooden chair" + requirement "must be a seat" → DEFINITELY MET (that is what a chair is)

  - For CONDITIONAL information: the item information has to settle it, by saying so or by
    plainly implying it - never by assumption
    Example: "wooden chair" + requirement "must be upholstered" → NO CONCLUSIVE EVIDENCE
    Example: "upholstered chair" + requirement "must be upholstered" → DEFINITELY MET (explicitly stated)

  NEVER infer conditional information from:
  - Category title ("frozen fish" title does not mean item is frozen)
  - Requirement itself ("must be frozen" requirement does not mean item is frozen)
  - Sibling categories (siblings are "fresh" does not mean this item is frozen)

  IMPORTANT CLASSIFICATION PRINCIPLES:
  1. You MUST verify EVERY requirement - do not skip any
  2. If a requirement says "Must be X", verify the item IS actually X
  3. General compatibility is NOT enough - specific requirements must be met
  4. Example: "Must be storage units" means the PRIMARY function is data storage
  5. Example: "Must be input or output units" means the item IS a peripheral device
     (keyboard, mouse, monitor, printer), NOT a complete computer that HAS these components
  6. Example: "Must be processing units" means the item IS the CPU/processing unit,
     NOT a complete computer that HAS a processing unit inside
  7. You MAY use DEFINITIVE knowledge about objects - information that is INHERENTLY true
     for ALL instances of that object type.

     CRITICAL DISTINCTION: "IS" vs "HAS" / "CONTAINS"

     When evaluating "Must be X" requirements:

     CORRECT interpretation - "IS":
     - "keyboard" + "Must be input unit" → YES (keyboard IS an input unit)
     - "monitor" + "Must be output unit" → YES (monitor IS an output unit)
     - "HDD" + "Must be storage unit" → YES (HDD IS a storage unit)
     - "CPU chip" + "Must be processing unit" → YES (CPU IS a processing unit)

     WRONG interpretation - "HAS/CONTAINS":
     - "laptop" + "Must be input unit" → NO (laptop HAS keyboard, but laptop IS NOT an input unit)
     - "laptop" + "Must be output unit" → NO (laptop HAS display, but laptop IS NOT an output unit)
     - "laptop" + "Must be storage unit" → NO (laptop HAS HDD, but laptop IS NOT a storage unit)
     - "laptop" + "Must be processing unit" → NO (laptop HAS CPU, but laptop IS NOT just a processing unit)

     COMPLETE MACHINES vs COMPONENTS:
     - Laptop/Notebook/Desktop = COMPLETE automatic data processing machine
     - Keyboard/Mouse/Monitor = Input/Output UNITS (components/peripherals)
     - HDD/SSD/Flash drive = Storage UNITS (components)
     - CPU/Motherboard = Processing UNITS (components)

     KEY PRINCIPLE: A complete machine CONTAINS components, but IS NOT a component.

     ALLOWED - Definitive expansion (true for ALL instances):
     ✓ "wooden chair" → is a seat (the item word and the category word differ, it is still one)
     ✓ "wooden chair" → is a complete seat, not a part of one (an article is not a part of itself)
     ✓ "wooden chair" → is not metal (true of every wooden chair)
     ✓ "roller bearing" → is not a ball bearing (a near sibling is still a different article)
     ✓ "HDD" / "hard disk drive" → primary function is data storage (functional definition)
     ✓ "keyboard" → primary function is user input (functional definition)
     ✓ "steel bolt" → is not a nut and not a washer (same family, different article)

     FORBIDDEN - Conditional assumption (varies between instances):
     - "salmon" → is frozen (some salmon is frozen, some is fresh - CONDITIONAL)
     - "salmon" → weighs 2kg (salmon come in different sizes - CONDITIONAL)
     - "fish" → is whole (some fish is filleted, some is whole - CONDITIONAL)
     - "valve" → made of brass (valves can be brass, steel, plastic - CONDITIONAL)
     - "HDD" → has 1TB capacity (HDDs have various capacities - CONDITIONAL)

     TEST: Ask yourself "Is this true for EVERY instance, or does it vary?"
     - EVERY instance → Definitive expansion allowed
     - VARIES → only the item information settles it, never an assumption,
       otherwise it is NO CONCLUSIVE EVIDENCE

  8. If documentation/certification IS mentioned in requirements/exclusions - then it's required
  9. If documentation/certification is NOT mentioned in requirements/exclusions - ignore it
  10. When description states item's purpose (e.g., "for breeding"), accept it as fact
  11. When description states item's characteristics (e.g., "purebred"), accept it as fact

  You MUST respond with EXACTLY ONE of these three options for EACH candidate:
  - MATCH: category fit is DEFINITELY YES, ALL requirements are DEFINITELY MET, and ALL
    exclusions are DEFINITELY DOES NOT APPLY
  - CONTRADICTION: category fit is DEFINITELY NO, OR any requirement is DEFINITELY NOT
    MET, OR any exclusion DEFINITELY APPLIES
  - INSUFFICIENT_INFORMATION: nothing contradicts, but the category fit or at least one
    requirement or exclusion is NO CONCLUSIVE EVIDENCE

  ═══════════════════════════════════════════════════════════════════════════════
  PARTS CLASSIFICATION HIERARCHY (Critical for items marked as PART)
  ═══════════════════════════════════════════════════════════════════════════════

  When classifying items marked as "*** ITEM TYPE: PART/COMPONENT ***", follow this STRICT hierarchy:

  STEP 1 - CHECK FOR EXPLICIT HEADING (GIR 1):
  Does the item have its OWN dedicated HS heading based on what it IS?

  Examples where item gets its OWN heading (NOT classified as "parts of X"):
  - Printed Circuit Board (PCB) → 8534 (even if it's "PCB for printer")
  - Ball bearings → 8482 (even if "bearings for car engine")
  - Electric motors → 8501 (even if "motor for washing machine")
  - Pumps → 8413 (even if "pump for vehicle")
  - Valves → 8481 (even if "valve for engine")
  - Filters → 8421 (even if "filter for car")
  - Transformers → 8504 (even if "transformer for computer")

  IF item has its own heading → classify there, NOT as "parts of machinery"

  STEP 2 - CHECK FOR "PARTS OF GENERAL USE":
  These items ALWAYS stay in their generic chapter, NEVER go to "parts of X":

  - Screws, bolts, nuts, rivets → 7318 (even if "screws for printer")
  - Springs → 7320 (even if "spring for vehicle")
  - Hinges, castors, mountings → 8302 (even if "hinge for machine")
  - Locks, clasps → 8301 (even if "lock for vehicle")
  - Rubber gaskets/seals → 4016 (even if "gasket for engine")
  - Plastic parts n.e.s. → 3926 (general plastic articles)

  IF item is "part of general use" → classify in its generic chapter

  STEP 3 - CHECK "SOLELY OR PRINCIPALLY" (Section XVI Note 2):
  ONLY if Steps 1 & 2 don't apply, check:
  Is the part "suitable for use SOLELY or PRINCIPALLY" with specific machinery?

  Key phrase: "parts suitable for use solely or principally with..."

  Examples of parts that GO TO parts headings:
  - Oil pump DESIGNED ONLY for car engines → 8708 (vehicle parts)
  - Printer drum assembly (no other use) → 8443.99 (printer parts)
  - Washing machine drum (specific) → 8450.90 (washing machine parts)
  - Car body panels → 8708 (vehicle parts)

  STEP 4 - MULTI-USE PARTS:
  If a part can serve EQUALLY in multiple different machine types
  (e.g., fits both Ch.84 and Ch.85 machines) → classify by its NATURE

  ═══════════════════════════════════════════════════════════════════════════════
  FINAL DECISION RULES (CRITICAL - Apply immediately before responding)
  ═══════════════════════════════════════════════════════════════════════════════

  STOP! Before writing your response, verify for EACH candidate:

  STEP 1 - TERMINOLOGY CHECK:
  ─────────────────────────────
  • Requirements MUST use: DEFINITELY MET / DEFINITELY NOT MET / NO CONCLUSIVE EVIDENCE
  • Exclusions MUST use: DEFINITELY APPLIES / DEFINITELY DOES NOT APPLY / NO CONCLUSIVE EVIDENCE

  If you wrote "DEFINITELY DOES NOT APPLY" for a requirement → WRONG! Change to
  "DEFINITELY NOT MET"

  STEP 2 - RESULT VALIDATION:
  ─────────────────────────────
  1. Did you mark ANY requirement as "DEFINITELY NOT MET"?
     → If YES: result = "CONTRADICTION"

  2. Did you mark ANY exclusion as "DEFINITELY APPLIES"?
     → If YES: result = "CONTRADICTION"

  3. Otherwise, if ANY requirement or exclusion is "NO CONCLUSIVE EVIDENCE":
     → result = "INSUFFICIENT_INFORMATION"

  4. ONLY if category_match is "DEFINITELY YES" AND ALL requirements are
     "DEFINITELY MET" AND ALL exclusions are "DEFINITELY DOES NOT APPLY":
     → result = "MATCH"

  STEP 3 - COMPLETENESS CHECK:
  ─────────────────────────────
  Count the requirements listed for this candidate.
  Count the cited_requirements_and_exclusions you wrote.
  → They MUST match! If candidate has 3 requirements, you MUST have 3 requirement evaluations.

  If you skipped a requirement → GO BACK and evaluate it!
  Skipping "Must be rotary wafer switches" because item is not one → WRONG!
  You MUST still cite it as "DEFINITELY NOT MET" → which means CONTRADICTION!

  ═══════════════════════════════════════════════════════════════════════════════
  RESPONSE FORMAT - JSON ARRAY
  ═══════════════════════════════════════════════════════════════════════════════

  You MUST respond with a JSON array containing an evaluation for EACH candidate.
  The array MUST have EXACTLY one entry per candidate - one for each candidate listed below.
  No comments in the json

  ```json
  [
    {{
      "item_information": "<The information given about the item being clasified>",
      "candidate_id": "<ID from Candidate 1>",
      "category_fit_analysis": "<the qualifying conditions in the Description> - <the evidence>",
      "category_match": "DEFINITELY YES" or "DEFINITELY NO" or "NO CONCLUSIVE EVIDENCE",
      "cited_requirements_and_exclusions": [
        "<Requirement 1> - <evidence examination> - DEFINITELY MET/DEFINITELY NOT MET/NO CONCLUSIVE EVIDENCE",
        "<Requirement 2> - <evidence examination> - DEFINITELY MET/DEFINITELY NOT MET/NO CONCLUSIVE EVIDENCE",
        "<Exclusion 1> - <evidence examination> - DEFINITELY APPLIES/DEFINITELY DOES NOT APPLY/NO CONCLUSIVE EVIDENCE",
        "<Exclusion 2> - <evidence examination> - DEFINITELY APPLIES/DEFINITELY DOES NOT APPLY/NO CONCLUSIVE EVIDENCE"
      ],
      "reasoning": "<Your detailed analysis for this candidate>",
      "result": "MATCH" or "CONTRADICTION" or "INSUFFICIENT_INFORMATION"
    }},
    {{
      "item_information": "<The information given about the item being clasified>",
      "candidate_id": "<ID from Candidate 2>",
      "category_fit_analysis": "<the qualifying conditions in the Description> - <the evidence>",
      "category_match": "DEFINITELY YES" or "DEFINITELY NO" or "NO CONCLUSIVE EVIDENCE",
      "cited_requirements_and_exclusions": ["... ALL requirements AND exclusions ..."],
      "reasoning": "<Your detailed analysis for this candidate>",
      "result": "MATCH" or "CONTRADICTION" or "INSUFFICIENT_INFORMATION"
    }},
    ... (continue for ALL candidates)
  ]
  ```

